[package]
name = "rustclipsync-agent"
version = "0.3.1"
edition = "2021"
license = "MIT"
publish = false

[features]
# Type-check Win32 adapters on a Linux build host; never execute this feature there.
check-windows = []

[dependencies]
rustclipsync-core = { version = "=0.2.0", path = "vendor/rustclipsync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
ring = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wl-clipboard-rs = "=0.9.5"
x11rb = { version = "=0.13.2", features = ["xfixes"] }
dbus-secret-service = { version = "=4.1.0", features = ["crypto-rust"] }
dbus = "=0.9.12"
signal-hook = "0.3"

[dependencies.windows-sys]
version = "=0.60.2"
features = [
 "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
 "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_DataExchange",
 "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory",
 "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"
]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.9"
