name: Windows agent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust MSVC toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.99.1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target
          key: windows-rust-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-rust-1.99.1-${{ hashFiles('Cargo.lock') }}-
            windows-rust-1.99.1-
      - run: python scripts/verify-core.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test portable logic and Windows storage/DPAPI
        run: cargo test --locked -- --test-threads=1
      - name: Test the clipboard on the disposable hosted Windows runner
        env:
          RCS_WINDOWS_DISPOSABLE: "1"
        run: cargo test --locked --test windows_clipboard -- --ignored --test-threads=1
      - name: Test native named pipe and durable controls
        env:
          RCS_WINDOWS_DISPOSABLE: "1"
        run: cargo test --locked --test windows_control -- --ignored --test-threads=1
      - name: Build native background agent
        run: cargo build --locked --release --bin rustclipsync-agent
      - name: Build self-contained WinUI and per-user installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test install, double-click, icon and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Upload installer and visual verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustclipsync-windows-x64-setup
          path: |
            dist/installer/*
            ui/RustClipSync/packages.lock.json
      - name: Upload unsigned development binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustclipsync-agent-windows-x64-development
          path: target/release/rustclipsync-agent.exe
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: target
          key: windows-rust-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.99.1
      - name: Install Linux Secret Service build dependency
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: python3 scripts/verify-core.py
      - run: cargo test --locked
      - run: cargo clippy --locked --features check-windows --all-targets -- -D warnings
