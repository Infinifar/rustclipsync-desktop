name: Diagnose installed Windows app
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Workflow run containing the setup artifact
        required: true
        default: '41194209572'
      rebuild_ui:
        description: Rebuild UI and packaging, reusing the already compiled Rust agent
        type: boolean
        default: false
      source_artifact:
        description: Artifact containing the installer
        default: rustclipsync-windows-x64-setup
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the already built installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
        run: |
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name $env:SOURCE_ARTIFACT --dir downloaded
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          $setup = Get-ChildItem downloaded -Recurse -Filter 'RustClipSync-*-setup-x64.exe' | Select-Object -First 1
          if (!$setup) { throw 'No installer in artifact' }
          Copy-Item $setup.FullName dist/installer
      - name: Rebuild UI and installer with the existing background executable
        if: inputs.rebuild_ui
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item 'dist/installer/RustClipSync-*-setup-x64.exe'
          $seed = Join-Path $env:RUNNER_TEMP 'RustClipSync-build-seed'
          $install = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',"/DIR=`"$seed`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Unable to recover the compiled background executable' }
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item "$seed/rustclipsync-agent.exe" target/release
          $remove = Start-Process "$seed/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw 'Seed cleanup failed' }
          ./scripts/build-windows.ps1
      - name: Exercise the installed app and collect startup diagnostics
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-app-diagnostics
          path: |
            dist/installer/*.png
            dist/installer/*.log
            dist/installer/*.exe
            dist/installer/SHA256SUMS
